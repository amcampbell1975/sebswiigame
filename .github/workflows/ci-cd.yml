name: C Build Pipeline

on: [push] # Trigger the pipeline every time you push code

jobs:
  build:
    runs-on: ubuntu-latest # Uses a free Linux virtual machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Downloads your repo onto the runner

      - name: Compile with GCC
        run: gcc hello.c -o hello # The actual compilation step

      - name: Run the program
        run: ./hello # Executes the compiled file to verify it works
