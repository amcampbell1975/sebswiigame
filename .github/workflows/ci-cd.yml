name: X11 Build and Release

#on:
#  push:
#    tags:
#      - "v*" # Runs only when you push a tag starting with 'v' (e.g., v1.0)

permissions:
  contents: write # Required to upload files to a Release

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install X11 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Compile
        run: gcc hello.c -o hello_x11 -lX11

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hello_x11 # The specific file to attach to the release
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
