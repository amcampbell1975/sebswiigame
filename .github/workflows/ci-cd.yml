name: C Build Pipeline

on: [push] # Trigger the pipeline every time you push code

jobs:
  build:
    runs-on: ubuntu-latest # Uses a free Linux virtual machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Downloads your repo onto the runner

      - name: Install X11 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev # Required for X11 headers

      - name: Compile with GCC
        # IMPORTANT: -lX11 tells the compiler to link the X11 library
        run: gcc hello.c -o hello -lX11 

      - name: Verify Build
        run: ls -l hello # Checking if the binary was created

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4 # Recommended version
        with:
          name: x11-hello-world           # The name of the zip file to download
          path: hello                     # The name of the executable you compiled
          retention-days: 5               # Optional: how long to keep the file

